<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f0f2ff">
  <meta name="description" content="把小星星分成组，听一句口诀，点亮一颗星球。支持中英文、分组提示和语音复习。">
  <title>乘法星球 · Kris 的学习乐园</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/math-game.css?v=math-v1">
  <script src="assets/math-core.js?v=cb2baf5e4b18" defer></script>
  <script src="assets/math-game.js?v=math-v1" defer></script>
</head>
<body data-mode="multiplication">
  <a class="skip-link" href="#game">跳到游戏 / Skip to game</a>
  <header class="topbar">
    <a class="home-link" href="index.html"><span aria-hidden="true">←</span> <span data-i18n="home">回到乐园</span></a>
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">k.</span><span>Kris <small data-i18n="playground">的学习乐园</small></span></a>
    <div class="toolbar"><button type="button" id="mute" class="utility" aria-pressed="false">🔊 <span data-i18n="soundOn">声音开</span></button><button type="button" id="language" class="utility" lang="en" aria-label="Switch to English">EN</button></div>
  </header>
  <main id="game" class="game-shell">
    <section class="intro" aria-labelledby="game-title"><div><p class="eyebrow">PLAY · DISCOVER · GROW</p><h1 id="game-title">乘法星球<span aria-hidden="true">✦</span></h1><p id="game-description">把小星星分成组，听一句口诀，点亮一颗星球。</p></div><div class="mode-switch"><a href="addition_game.html"  data-i18n="addition">加法果园</a><a href="multiplication_game.html" aria-current="page" data-i18n="multiplication">乘法星球</a></div></section>
    <section class="journey" id="journey" aria-label="练习进度"><div class="journey-label"><span data-i18n="mission">今天的小任务</span><strong id="round-label">第 1 / 6 题</strong></div><ol id="progress" class="progress"></ol><div class="star-total"><span aria-hidden="true">★</span><strong id="star-count">0</strong><span data-i18n="stars">颗星星</span></div></section>
    <div class="settings"><label for="range" data-i18n="rangeLabel">练习范围</label><select id="range"></select><button type="button" class="text-button" id="restart" data-i18n="restart">重新开始 ↻</button></div>
    <section id="play-panel" class="play-layout">
      <div class="scene-panel"><div class="scene-heading"><span class="pill" id="scene-tag">动手数一数</span><span class="scene-doodle" aria-hidden="true">✧ · ✦</span></div><div class="mascot" aria-hidden="true"><span>🪐</span><i>✦</i><i>✧</i></div><h2 id="scene-title"></h2><p class="scene-instruction" id="scene-instruction"></p><div id="objects" class="objects"></div><p id="counting" class="counting" aria-live="polite"></p><button type="button" id="hint" class="hint-button" data-i18n="hint">💡 换个思路</button><p id="hint-text" class="hint-text" hidden></p></div>
      <div class="question-panel"><p id="question-label" class="eyebrow">想一想，再选一选</p><h2 id="equation" class="equation" tabindex="-1"></h2><p id="question-help"></p><div id="choices" class="choices" role="group" aria-label="选择答案"></div><form id="answer-form" novalidate><label for="answer" data-i18n="typeAnswer">也可以输入答案</label><div class="answer-row"><input id="answer" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" aria-describedby="feedback"><button id="check" type="submit" class="check-button" data-i18n="check">检查</button></div></form><p id="feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true"></p><button type="button" id="learn" class="text-button" data-i18n="learn">一起看答案</button><div id="result" class="result" hidden><p id="result-label"></p><p id="result-equation"></p><strong id="mnemonic" lang="zh-CN"></strong><div class="result-actions"><button type="button" id="replay" class="replay" data-i18n="replay">🔊 再听一次</button><button type="button" id="next" class="primary" data-i18n="next">下一题 →</button></div></div></div>
    </section>
    <section id="summary" class="summary" aria-labelledby="summary-title" hidden><div class="summary-medal" aria-hidden="true">🏅</div><p class="eyebrow">LITTLE STEPS, BIG DISCOVERIES</p><h2 id="summary-title" tabindex="-1"></h2><p id="summary-copy"></p><div id="summary-stars" class="summary-stars" aria-hidden="true"></div><h3 data-i18n="review">点一点，再听一遍</h3><div id="review-list" class="review-list"></div><button type="button" id="play-again" class="primary" data-i18n="playAgain">再来一轮 ↻</button><a class="text-button" href="index.html" data-i18n="otherGames">回乐园玩别的游戏</a></section>
    <p id="speech-status" class="speech-status" role="status" aria-live="polite"></p><p class="gentle-note" data-i18n="gentle">不用抢时间，想一想、数一数，每次尝试都在进步。</p>
    <noscript><p class="noscript">这个小游戏需要启用 JavaScript。This game needs JavaScript. <a href="index.html">返回乐园 / Back home</a></p></noscript>
  </main>
  <footer>Kris <span aria-hidden="true">✦</span> <span data-i18n="footer">让好奇心发芽</span></footer>
</body>
</html>
