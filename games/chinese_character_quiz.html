<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>看图识字</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Marker Felt', '楷体', sans-serif;
            background-color: #e9f5ff;
            text-align: center;
            user-select: none;
            touch-action: manipulation;
            margin: 0;
            padding: 0;
        }

        #game-container {
            max-width: 600px;
            margin: 20px auto;
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #ff6b6b;
            font-size: 28px;
            margin-bottom: 20px;
        }

        #image-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px auto;
            border: 2px solid #ddd;
            background-color: #f0f0f0;
            display: flex; /* To center the image */
            align-items: center; /* To center the image */
            justify-content: center; /* To center the image */
        }

        #image-container img {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }

        #options-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-button {
            background-color: #74c0fc;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px 20px;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .option-button:hover,
        .option-button:active {
            transform: scale(1.05);
            background-color: #4dabf7;
        }

        #feedback-message {
            font-size: 22px;
            font-weight: bold;
            margin: 15px 0;
            min-height: 30px;
        }

        #feedback-message.correct {
            color: #40c057;
        }

        #feedback-message.wrong {
            color: #fa5252;
        }

        #score-display {
            font-size: 20px;
            color: #555;
            margin-top: 15px;
        }
    </style>
<script defer src="../assets/reviews/config.js?v=09163975f7cc"></script><script defer src="../assets/reviews/reviews.js?v=6b47f21a62b6"></script>
<link rel="stylesheet" href="../assets/i18n.css?v=66e8355ff2fe">
<script src="../assets/i18n.js?v=4bcf2a93334a"></script>
<script src="../assets/i18n-site.js?v=a70fdf15f66e"></script>
<script src="../assets/i18n-legacy-learning.js?v=473e400a1a8a"></script>
<script src="../assets/i18n-reviews.js?v=b8628bc427aa"></script>
<link rel="stylesheet" href="../assets/learning-worlds.css?v=effeea9a9f7c">
</head>
<body class="learning-world picture-world">
    <div id="game-container">
        <a class="home-link" href="../index.html">返回首页</a><h1>看图识字</h1><span class="world-icon" aria-hidden="true">🎨</span><p class="world-intro">走进图画小镇，找到图片对应的汉字。每答一题，收藏一张词语卡！</p><div id="picture-trail" class="journey-trail" aria-label="旅程进度"></div>
        <div id="image-container">
            <!-- Placeholder for image -->
        </div>
        <div id="options-container">
            <!-- Placeholder for options -->
        </div>
        <div id="picture-reading" translate="no" lang="zh"></div><button class="world-action" id="picture-next" hidden>下一题</button><div id="feedback-message" role="status" aria-live="polite">
            <!-- Placeholder for feedback -->
        </div>
        <div id="score-display">得分: 0</div>
    </div>

    <script>

const questions=[
 {image:'../assets/learning-pictures/apple.svg',options:['苹果','香蕉','橙子','西瓜'],correctAnswer:'苹果',reading:'píng guǒ'},
 {image:'../assets/learning-pictures/car.svg',options:['火车','飞机','汽车','月亮'],correctAnswer:'汽车',reading:'qì chē'},
 {image:'../assets/learning-pictures/banana.svg',options:['香蕉','草莓','桃子','葡萄'],correctAnswer:'香蕉',reading:'xiāng jiāo'},
 {image:'../assets/learning-pictures/moon.svg',options:['月亮','太阳','星星','白云'],correctAnswer:'月亮',reading:'yuè liang'},
 {image:'../assets/learning-pictures/fish.svg',options:['小鱼','小鸟','小猫','小狗'],correctAnswer:'小鱼',reading:'xiǎo yú'},
 {image:'../assets/learning-pictures/tree.svg',options:['大树','小草','花朵','石头'],correctAnswer:'大树',reading:'dà shù'}
];
const imageContainer=document.getElementById('image-container'),optionsContainer=document.getElementById('options-container'),feedbackMessage=document.getElementById('feedback-message'),scoreDisplay=document.getElementById('score-display'),pictureNext=document.getElementById('picture-next');
let currentQuestionIndex=0,score=0,pictureAnswered=false,pictureVersion=0;
function createOptionButton(character){const b=document.createElement('button');b.type='button';b.textContent=character;b.setAttribute('translate','no');b.setAttribute('lang','zh');b.className='option-button';const version=pictureVersion;b.addEventListener('click',()=>{if(version===pictureVersion)selectAnswer(character);});return b;}
function loadQuestion(){pictureVersion++;pictureAnswered=false;optionsContainer.innerHTML='';feedbackMessage.textContent='';feedbackMessage.className='';pictureNext.hidden=true;document.getElementById('picture-reading').textContent='';
 document.getElementById('picture-trail').innerHTML=questions.map((q,i)=>`<span class="journey-stop ${i<currentQuestionIndex?'earned':i===currentQuestionIndex?'current':''}">${i<currentQuestionIndex?'★':i+1}</span>`).join('');
 if(currentQuestionIndex>=questions.length){imageContainer.innerHTML='<span class="world-icon" aria-hidden="true">🏘️</span>';feedbackMessage.textContent=`游戏结束! 你的总分是: ${score} / ${questions.length}`;feedbackMessage.className='correct';const b=document.createElement('button');b.type='button';b.className='option-button';b.textContent='再玩一次';const version=pictureVersion;b.addEventListener('click',()=>{if(version===pictureVersion)initGame();});optionsContainer.appendChild(b);b.focus();return;}
 const q=questions[currentQuestionIndex];imageContainer.innerHTML=`<img src="${q.image}" alt="题目图片" width="200" height="200">`;
 const choices=q.options.slice();for(let i=choices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]];}choices.forEach(c=>optionsContainer.appendChild(createOptionButton(c)));
}
function selectAnswer(character){if(pictureAnswered||currentQuestionIndex>=questions.length)return;const q=questions[currentQuestionIndex];if(!q.options.includes(character))return;pictureAnswered=true;const correct=character===q.correctAnswer;if(correct)score++;feedbackMessage.textContent=correct?'太棒了!':`错误! 正确的是: ${q.correctAnswer}`;feedbackMessage.className=correct?'correct':'wrong';scoreDisplay.textContent=`得分: ${score}`;document.getElementById('picture-reading').textContent=q.correctAnswer+' · '+q.reading;optionsContainer.querySelectorAll('button').forEach(b=>{b.disabled=true;b.classList.toggle('chosen-correct',b.textContent===q.correctAnswer);});pictureNext.hidden=false;pictureNext.focus();}
function initGame(){currentQuestionIndex=0;score=0;scoreDisplay.textContent='得分: 0';loadQuestion();}
pictureNext.addEventListener('click',()=>{if(!pictureAnswered)return;currentQuestionIndex++;loadQuestion();optionsContainer.querySelector('button')?.focus();});window.addEventListener('DOMContentLoaded',initGame);

</script>
<kris-reviews data-game="chinese_character_quiz"></kris-reviews></body>
</html>
