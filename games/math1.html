<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一年级数字游戏</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Marker Felt', '楷体', sans-serif;
            background-color: #e9f5ff;
            margin: 0;
            padding: 10px;
            text-align: center;
            color: #333;
            user-select: none;
            touch-action: manipulation;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 15px;
            position: relative;
        }
        h1 {
            color: #ff6b6b;
            margin-bottom: 15px;
            font-size: 24px;
        }
        .cheer {
            color: #ff6b6b;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .timer {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #ff8787;
            color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }
        .shapes-container {
            height: 200px;
            margin: 20px auto;
            background-color: #f8f9fa;
            border-radius: 15px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
        }
        .shape {
            margin: 8px;
            transition: transform 0.2s;
        }
        .shape svg {
            width: 40px;
            height: 40px;
        }
        .numbers {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }
        .number {
            background-color: #74c0fc;
            color: white;
            border: none;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .number:hover, .number:active {
            transform: scale(1.1);
            background-color: #4dabf7;
        }
        .message {
            height: 40px;
            font-size: 24px;
            margin: 15px 0;
            font-weight: bold;
        }
        .correct {
            color: #40c057;
        }
        .wrong {
            color: #fa5252;
        }
        .score {
            font-size: 20px;
            margin-top: 15px;
            color: #495057;
        }
        .stars {
            margin: 15px 0;
            font-size: 26px;
            color: #fcc419;
        }
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: none;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f76707;
            border-radius: 50%;
        }
        .progress-bar {
            height: 15px;
            background-color: #e9ecef;
            border-radius: 8px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background-color: #ff6b6b;
            width: 0%;
            transition: width 0.5s;
        }
        
        /* 响应式设计，适配手机 */
        @media (max-width: 600px) {
            body {
                padding: 5px;
            }
            .container {
                padding: 10px;
            }
            h1 {
                font-size: 20px;
                margin-bottom: 10px;
            }
            .cheer {
                font-size: 18px;
            }
            .timer {
                width: 40px;
                height: 40px;
                font-size: 20px;
                top: 10px;
                right: 10px;
            }
            .shapes-container {
                height: 180px;
                margin: 15px auto;
            }
            .shape svg {
                width: 35px;
                height: 35px;
            }
            .number {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
            .message {
                font-size: 20px;
                height: 30px;
            }
        }
    </style>
<script defer src="../assets/reviews/config.js?v=09163975f7cc"></script><script defer src="../assets/reviews/reviews.js?v=6b47f21a62b6"></script>

<script src="../assets/i18n.js?v=4bcf2a93334a"></script>
<script src="../assets/i18n-site.js?v=a70fdf15f66e"></script>
<script src="../assets/i18n-legacy-learning.js?v=473e400a1a8a"></script>

</head>
<body class="learning-world counting-world">
    <div class="container">
        <a class="home-link" href="../index.html">返回首页</a><h1>数一数有多少个图形？</h1>
        <span class="world-icon" aria-hidden="true">🌱</span><p class="world-intro">点一点图形，做上数数标记。收集十颗种子，种满你的花园！</p>
        <div class="timer" id="timer" aria-label="剩余秒数">2</div>
        
        <div class="shapes-container" id="shapes-container">
            <!-- 图形将通过JavaScript生成 -->
        </div>
        
        <div class="numbers" id="numbers">
            <!-- 数字选项将通过JavaScript生成 -->
        </div>
        
        <div class="message" id="message" role="status" aria-live="polite"></div><button class="world-action" id="count-next" hidden>下一题</button><button class="world-action" id="count-restart">重新开始</button>
        <div class="score">得分: <span id="score">0</span></div>
        <div class="stars" id="stars"></div>
        
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
    </div>
    
    <div class="celebration" id="celebration"></div>
    
    <script>

const gameState = {score:0,currentCount:0,timerValue:0,level:1,playing:false,round:0,marked:0};
const shapesContainer=document.getElementById('shapes-container'), numbersContainer=document.getElementById('numbers'), messageElement=document.getElementById('message'), scoreElement=document.getElementById('score'), starsElement=document.getElementById('stars'), progressElement=document.getElementById('progress');
const nextCount=document.getElementById('count-next');
const shapes=[`<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38" fill="#d97956"/></svg>`,`<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="14" y="14" width="72" height="72" rx="14" fill="#6d89ca"/></svg>`,`<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 9 95 88H5Z" fill="#649a67"/></svg>`,`<svg viewBox="0 0 100 100" aria-hidden="true"><path d="m50 7 13 28 30 5-22 24 5 30-26-15-26 15 5-30L7 40l30-5Z" fill="#d5a838"/></svg>`];
let countDeck=[];
function initGame(){gameState.score=0;gameState.round=0;scoreElement.textContent='0';starsElement.textContent='';countDeck=Array.from({length:10},(_,i)=>i+1);for(let i=9;i>0;i--){const j=Math.floor(Math.random()*(i+1));[countDeck[i],countDeck[j]]=[countDeck[j],countDeck[i]];}createNumberButtons();startNewRound();}
function createNumberButtons(){numbersContainer.innerHTML='';for(let n=0;n<=10;n++){const b=document.createElement('button');b.type='button';b.className='number';b.textContent=n;b.addEventListener('click',()=>checkAnswer(n));numbersContainer.appendChild(b);}}
function startNewRound(){
 nextCount.hidden=true;messageElement.textContent='';messageElement.className='message';gameState.marked=0;
 if(gameState.round>=10){gameState.playing=false;messageElement.textContent=`花园完成！收集了 ${gameState.score} 颗种子。`;document.querySelectorAll('.number').forEach(b=>b.disabled=true);document.getElementById('count-restart').focus();return;}
 gameState.currentCount=countDeck[gameState.round];gameState.playing=true;shapesContainer.innerHTML='';
 document.querySelectorAll('.number').forEach(b=>b.disabled=false);
 for(let i=0;i<gameState.currentCount;i++){const b=document.createElement('button');b.type='button';b.className='shape';b.setAttribute('aria-label','标记一个图形');b.setAttribute('aria-pressed','false');b.innerHTML=shapes[Math.floor(Math.random()*shapes.length)];b.addEventListener('click',()=>{if(!gameState.playing||!shapesContainer.contains(b)||b.classList.contains('counted'))return;b.classList.add('counted');b.setAttribute('aria-pressed','true');const label=document.createElement('span');label.className='count-tag';label.textContent=++gameState.marked;b.appendChild(label);});shapesContainer.appendChild(b);}
 progressElement.style.width=(gameState.round/10*100)+'%';
}
function checkAnswer(n){if(!gameState.playing)return;gameState.playing=false;gameState.round++;const correct=n===gameState.currentCount;if(correct){gameState.score++;scoreElement.textContent=gameState.score;messageElement.textContent='答对了！';}else{messageElement.textContent='答错了，正确答案是 '+gameState.currentCount;}
 messageElement.className='message '+(correct?'correct':'wrong');starsElement.textContent='🌱'.repeat(gameState.score);progressElement.style.width=(gameState.round/10*100)+'%';document.querySelectorAll('.number').forEach(b=>b.disabled=true);nextCount.hidden=false;nextCount.focus();}
nextCount.addEventListener('click',()=>{if(!nextCount.hidden){startNewRound();if(gameState.playing)numbersContainer.querySelector('button').focus();}});document.getElementById('count-restart').addEventListener('click',initGame);
window.addEventListener('DOMContentLoaded',initGame);

</script>

</html>
