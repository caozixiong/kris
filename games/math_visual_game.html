<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>趣味视觉数学练习</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Marker Felt', '楷体', sans-serif;
            text-align: center;
            background-color: #FFFDE7; /* Light yellow */
            user-select: none;
            touch-action: manipulation;
            margin: 0;
            padding: 10px;
        }

        .game-container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            background-color: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid #ccc; /* Keep a subtle border */
        }

        h1 {
            color: #FF6B6B; /* Coral red */
            font-size: 2.2em;
        }

        .theme-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px; /* Adjusted margin */
            gap: 10px;
        }
        .theme-selector span {
            font-size: 1.1em;
            /* margin-right is handled by gap now */
        }
        .theme-selector button {
            background-color: #607D8B; /* Blue Grey */
            color: white;
            border: none;
            border-radius: 5px; /* Adjusted border-radius */
            padding: 8px 12px;
            font-size: 0.9em; /* Adjusted font-size */
            /* margin is handled by gap now */
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .theme-selector button:hover {
            background-color: #546E7A; /* Darker Blue Grey */
        }
        .theme-selector button.active-theme {
            background-color: #FFC107; /* Amber */
            font-weight: bold;
            color: #333; /* Darker text for better contrast on amber */
        }

        .times-symbol {
            margin: 0 0.2em; /* Adds a little space around the 'x' */
            font-weight: bold;
        }

        .problem-area {
            font-size: 2.5em; /* Larger font for problem */
            margin-bottom: 20px;
            color: #333; /* Good contrast for text */
            min-height: 100px; /* Increased min-height for visual elements */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .problem-area span { /* Style for the actual problem text/icons */
            padding: 10px;
        }

        .answer-options button {
            background-color: #7986CB; /* Lavender blue */
            color: white;
            border: none;
            border-radius: 15px;
            padding: 15px 20px;
            font-size: 1.8em;
            margin: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            -webkit-tap-highlight-color: transparent; /* Disable tap highlight on mobile */
        }

        .answer-options button:hover, .answer-options button:active {
            background-color: #5C6BC0; /* Darker lavender blue */
            transform: scale(1.05);
        }

        .timer-area, .score-area {
            margin-bottom: 15px;
            font-size: 1.3em;
            color: #555;
        }

        .controls button, .timer-controls button {
            background-color: #4DB6AC; /* Teal */
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 1.2em;
            margin: 5px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .controls button:hover, .controls button:active,
        .timer-controls button:hover, .timer-controls button:active {
            background-color: #26A69A; /* Darker teal */
            transform: scale(1.03);
        }

        .timer-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .timer-controls span {
            margin-right: 10px;
        }

        #timer-value {
            font-weight: bold;
            color: #00796B; /* Darker teal for emphasis */
        }

        .timer-controls button { /* Smaller buttons for timer adjustment */
            font-size: 1em;
            padding: 5px 10px;
        }

        .message-area {
            min-height: 30px;
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.2em;
        }

        .message-area .correct {
            color: #4CAF50; /* Green for correct */
        }

        .message-area .incorrect {
            color: #F44336; /* Red for incorrect */
        }

        #next-question {
            background-color: #FF8F00; /* Amber for next question */
        }
        #next-question:hover, #next-question:active {
            background-color: #FF6F00; /* Darker amber */
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            body {
                padding: 5px;
            }
            .game-container {
                padding: 15px;
                margin: 10px;
            }
            h1 {
                font-size: 1.8em;
            }
            .problem-area {
                font-size: 2em;
                min-height: 60px;
            }
            .answer-options button {
                font-size: 1.5em;
                padding: 12px 15px;
                margin: 8px;
            }
            .timer-area, .score-area {
                font-size: 1.1em;
            }
            .controls button, .timer-controls button {
                font-size: 1em;
                padding: 8px 12px;
            }
            .timer-controls button { /* Timer adjustment buttons even smaller */
                 font-size: 0.9em;
                 padding: 4px 8px;
            }
            .message-area {
                font-size: 1em;
            }
        }
    </style>
<script defer src="../assets/reviews/config.js?v=09163975f7cc"></script><script defer src="../assets/reviews/reviews.js?v=6b47f21a62b6"></script>
<link rel="stylesheet" href="../assets/i18n.css?v=66e8355ff2fe">
<script src="../assets/i18n.js?v=4bcf2a93334a"></script>
<script src="../assets/i18n-site.js?v=a70fdf15f66e"></script>
<script src="../assets/i18n-legacy-learning.js?v=0fc0d75b31ab"></script>
<script src="../assets/i18n-reviews.js?v=b8628bc427aa"></script>
<link rel="stylesheet" href="../assets/learning-worlds.css?v=517a195cc990">
</head>
<body class="learning-world arithmetic-world visual-world">
    <div class="game-container">
        <a class="home-link" href="../index.html">返回首页</a><h1>趣味视觉数学练习</h1><span class="world-icon" aria-hidden="true">🐥</span><p class="world-intro">用十格盘观察小鸡和火柴棒，解开八个图画谜题。</p><div id="journey-trail" class="journey-trail" aria-label="旅程进度"></div><div class="world-controls"><button id="calm-mode" aria-pressed="true">轻松探索</button><button id="timer-mode" aria-pressed="false">温柔计时提醒</button></div>

        <div class="timer-controls" id="timer-settings" hidden>
            <span>提醒间隔: <span id="timer-value">30</span><span>秒</span></span>
            <button id="decrease-timer" aria-label="减少时间" title="减少时间">-</button>
            <button id="increase-timer" aria-label="增加时间" title="增加时间">+</button>
        </div>

        <div class="theme-selector">
            <span>选择主题:</span>
            <button id="theme-matchsticks">火柴棒</button>
            <button id="theme-chicks">小鸡</button>
        </div>

        <div class="problem-area">
            <span id="problem-display">点击“开始游戏”</span>
        </div>

        <div id="math-tools" hidden></div><button class="world-action" id="show-tools">打开数学工具</button><div class="answer-options">
            <button id="ans1"></button>
            <button id="ans2"></button>
            <button id="ans3"></button>
        </div>

        <div class="timer-area" id="timer-area" hidden>
            提醒倒计时: <span id="time-left" aria-label="剩余秒数">—</span>
        </div>

        <div class="score-area">
            得分: <span id="score">0</span>
        </div>

        <div class="message-area">
            <span id="feedback-message" role="status" aria-live="polite"></span>
        </div>

        <div class="controls">
            <button id="start-game">开始游戏</button>
            <button id="next-question" style="display:none;">下一题</button>
        </div>
    </div>

    <script>

document.addEventListener('DOMContentLoaded',()=>{
 const $=id=>document.getElementById(id),visual=!!$('theme-chicks');
 const answerButtons=[$('ans1'),$('ans2'),$('ans3')];
 let currentProblem={},score=0,timerDuration=10,timerInterval=null,timeLeft=0,gameActive=false,answered=false,round=0,results=[],currentTheme='matchsticks',timed=false;
 function refresh(){window.KrisI18n?.refresh();}
 function quantity(n,theme){const icon=theme==='chicks'?'🐥':'●';return `<span class="quantity"><span class="quantity-grid" aria-hidden="true">${Array.from({length:n},()=>`<span class="quantity-item ${theme==='matchsticks'?'stick':''}">${theme==='matchsticks'?'':icon}</span>`).join('')||'<span class="quantity-item">0</span>'}</span><small>${n}</small></span>`;}
 function displayProblem(){const p=currentProblem;if(p.num1===undefined)return;$('problem-display').innerHTML=visual?`<span id="visual-equation">${quantity(p.num1,currentTheme)}<span>${p.operator}</span>${quantity(p.num2,currentTheme)}<span>= ?</span></span>`:`${p.num1} ${p.operator} ${p.num2} = ?`;$('problem-display').dataset.num1=p.num1;$('problem-display').dataset.num2=p.num2;$('problem-display').dataset.operator=p.operator;renderTools();}
 function renderTools(){const p=currentProblem;if(p.num1===undefined)return;const start=p.num1,end=p.correctAnswer;const lo=Math.min(start,end),hi=Math.max(start,end);$('math-tools').innerHTML=`<div class="number-line" aria-label="数轴">${Array.from({length:21},(_,n)=>`<span class="${n>=lo&&n<=hi?'travel ':''}${answered&&n===end?'landing':''}">${n}</span>`).join('')}</div>`;}
 function renderTrail(){ $('journey-trail').innerHTML=Array.from({length:8},(_,i)=>`<span class="journey-stop ${i<results.length?'earned':i===round&&gameActive?'current':''}">${i<results.length?(results[i]?'★':'✓'):i+1}</span>`).join(''); }
 function setTimer(on){timed=on;clearInterval(timerInterval);$('calm-mode').setAttribute('aria-pressed',String(!on));$('timer-mode').setAttribute('aria-pressed',String(on));$('timer-settings').hidden=!on;$('timer-area').hidden=!on;if(gameActive&&!answered)startTimer();}
 function startTimer(){clearInterval(timerInterval);timeLeft=timerDuration;$('time-left').textContent=timed?timeLeft:'∞';if(!timed)return;timerInterval=setInterval(()=>{if(!gameActive||answered)return;timeLeft--;$('time-left').textContent=timeLeft;if(timeLeft<=0){clearInterval(timerInterval);$('feedback-message').textContent='慢慢来，时间不影响得分。你可以继续思考。';refresh();}},1000);}
 function nextQuestion(){if(!gameActive||(!answered&&round>0))return;if(round>=8){gameActive=false;clearInterval(timerInterval);$('next-question').hidden=true;$('next-question').style.display='none';$('start-game').style.display='block';$('start-game').textContent='再玩一次';$('feedback-message').textContent=`旅程完成！答对 ${score} / 8 题。`;$('decrease-timer').disabled=false;$('increase-timer').disabled=false;renderTrail();refresh();$('start-game').focus();return;}
 answered=false;$('feedback-message').textContent='';$('feedback-message').className='';$('math-tools').hidden=true;$('show-tools').textContent='打开数学工具';$('next-question').hidden=true;$('next-question').style.display='none';const add=round%2===0;const a=Math.floor(Math.random()*21),b=Math.floor(Math.random()*((add?20-a:a)+1));currentProblem={num1:a,num2:b,operator:add?'+':'−',correctAnswer:add?a+b:a-b};displayProblem();
 const options=[currentProblem.correctAnswer];let candidates=Array.from({length:21},(_,i)=>i).filter(n=>!options.includes(n));for(let i=candidates.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[candidates[i],candidates[j]]=[candidates[j],candidates[i]];}options.push(...candidates.slice(0,2));for(let i=2;i>0;i--){const j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]];}answerButtons.forEach((b,i)=>{b.textContent=options[i];b.disabled=false;b.classList.remove('answer-correct');});renderTrail();startTimer();refresh();answerButtons[0].focus();}
 function startGame(){clearInterval(timerInterval);score=0;round=0;results=[];gameActive=true;answered=true;$('score').textContent='0';$('start-game').style.display='none';$('decrease-timer').disabled=true;$('increase-timer').disabled=true;nextQuestion();}
 function checkAnswer(button){if(!gameActive||answered||button.disabled)return;answered=true;clearInterval(timerInterval);const correct=Number(button.textContent)===currentProblem.correctAnswer;if(correct)score++;results.push(correct);round++;$('score').textContent=score;$('feedback-message').textContent=correct?'正确!':`错误！答案是 ${currentProblem.correctAnswer}`;$('feedback-message').className=correct?'correct':'incorrect';answerButtons.forEach(b=>{b.disabled=true;b.classList.toggle('answer-correct',Number(b.textContent)===currentProblem.correctAnswer);});$('math-tools').hidden=false;renderTools();renderTrail();$('next-question').hidden=false;$('next-question').style.display='block';refresh();$('next-question').focus();}
 $('start-game').addEventListener('click',startGame);$('next-question').addEventListener('click',()=>{if(answered)nextQuestion();});answerButtons.forEach(b=>b.addEventListener('click',()=>checkAnswer(b)));$('calm-mode').addEventListener('click',()=>setTimer(false));$('timer-mode').addEventListener('click',()=>setTimer(true));
 for(const [id,delta] of [['decrease-timer',-5],['increase-timer',5]])$(id).addEventListener('click',()=>{if(gameActive)return;timerDuration=Math.max(10,Math.min(60,timerDuration+delta));$('timer-value').textContent=timerDuration;});
 $('show-tools').addEventListener('click',()=>{if(!gameActive)return;$('math-tools').hidden=!$('math-tools').hidden;$('show-tools').textContent=$('math-tools').hidden?'打开数学工具':'收起数学工具';refresh();});
 if(visual)for(const theme of ['matchsticks','chicks'])$('theme-'+theme).addEventListener('click',()=>{currentTheme=theme;for(const t of ['matchsticks','chicks']){$('theme-'+t).classList.toggle('active-theme',t===theme);$('theme-'+t).setAttribute('aria-pressed',String(t===theme));}displayProblem();refresh();});
 answerButtons.forEach(b=>b.disabled=true);$('timer-value').textContent=timerDuration;renderTrail();if(visual){$('theme-matchsticks').setAttribute('aria-pressed','true');$('theme-chicks').setAttribute('aria-pressed','false');}
 window.addEventListener('pagehide',()=>clearInterval(timerInterval));
 window.KrisLearningMath={snapshot:()=>({currentProblem:{...currentProblem},score,round,answered,gameActive,timed,timeLeft,theme:currentTheme}),quantity};
});

</script>
<kris-reviews data-game="math_visual_game"></kris-reviews></body>
</html>
