<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉字寻宝翻翻乐</title>
    <style>
        body {
            font-family: 'KaiTi', '楷体', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f8ff; /* 淡蓝色背景 */
            color: #333;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #ff6347; /* 番茄色 */
        }

        .game-board {
            display: grid;
            /* 列数和行数会由JS根据卡片数量调整 */
            grid-template-columns: repeat(5, 100px); /* 默认值，JS会覆盖 */
            gap: 10px;
            perspective: 1000px; /* 为了3D翻转效果 */
        }

        .card {
            width: 100px;
            height: 100px;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card.flipped, .card.matched {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* 隐藏背面 */
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 2em; /* 调整汉字大小 */
            overflow: hidden; /* 防止图片溢出 */
        }

        .card-front {
            background-color: #fff;
            color: #333;
            transform: rotateY(180deg); /* 正面先转过去 */
        }

        .card-front img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        .card-back {
            background-color: #4682b4; /* 钢蓝色 */
            color: white;
            /* 可以用SVG或图片做卡片背面图案, 例如: */
            /* background-image: url('images/card_back_pattern.svg'); */
            /* background-size: cover; */
        }
        .card-back::before { /* 简单的问号图案 */
            content: '?';
            font-size: 2.5em;
            font-weight: bold;
        }

        /* 防止在翻转检查期间快速点击 */
        .board-locked .card:not(.matched) {
            pointer-events: none;
        }

        button {
            padding: 10px 20px;
            font-size: 1em;
            color: white;
            background-color: #5cb85c; /* 成功绿色 */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #4cae4c;
        }

        .win-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            z-index: 100;
        }

        .win-message h2 {
            color: #ff6347;
        }
    </style>
<script defer src="../assets/reviews/config.js?v=09163975f7cc"></script><script defer src="../assets/reviews/reviews.js?v=6b47f21a62b6"></script>
<link rel="stylesheet" href="../assets/i18n.css?v=66e8355ff2fe">
<script src="../assets/i18n.js?v=4bcf2a93334a"></script>
<script src="../assets/i18n-site.js?v=a70fdf15f66e"></script>
<script src="../assets/i18n-legacy-learning.js?v=473e400a1a8a"></script>

</head>
<body class="learning-world memory-world">
    <div class="header">
        <a class="home-link" href="../index.html">返回首页</a><h1>汉字寻宝翻翻乐</h1><span class="world-icon" aria-hidden="true">🏮</span><p class="world-intro">翻开一张汉字卡，再找它的图画朋友。把找到的汉字收藏进灯笼小巷。</p><div class="world-controls" aria-label="卡片数量"><button id="pairs-6" aria-pressed="true">6 对 · 小巷</button><button id="pairs-12" aria-pressed="false">12 对 · 花园</button><button id="pairs-20" aria-pressed="false">20 对 · 全部汉字</button></div><div id="memory-collection" translate="no" lang="zh"></div><p id="memory-status" role="status" aria-live="polite"></p>
        <p>得分: <span id="score">0</span> | 尝试次数: <span id="attempts">0</span></p>
        <button id="restart-button">重新开始</button>
    </div>

    <div id="game-board" class="game-board">
        <!-- 卡片将由JavaScript动态生成 -->
    </div>

    <div id="win-message" class="win-message" style="display: none;">
        <h2>恭喜你！全部找到了！</h2>
        <p>尝试次数: <span id="final-attempts"></span></p>
        <button id="play-again-button">再玩一次</button>
    </div>

    <script>

document.addEventListener('DOMContentLoaded',()=>{
 const gameData=[
                // 确保图片文件名与实际文件名一致，并且在 images/ 目录下
                // id 用于配对，确保每个汉字-图片组合的id相同
                { hanzi: "一", image: "one", id: 1 },
                { hanzi: "二", image: "two", id: 2 },
                { hanzi: "三", image: "three", id: 3 },
                { hanzi: "人", image: "person", id: 4 },
                { hanzi: "口", image: "mouth", id: 5 },
                { hanzi: "大", image: "big", id: 6 },
                { hanzi: "小", image: "small", id: 7 },
                { hanzi: "山", image: "mountain", id: 8 },
                { hanzi: "水", image: "water", id: 9 },
                { hanzi: "火", image: "fire", id: 10 },
                { hanzi: "木", image: "tree", id: 11 },
                { hanzi: "日", image: "sun", id: 12 },
                { hanzi: "月", image: "moon", id: 13 },
                { hanzi: "田", image: "field", id: 14 },
                { hanzi: "土", image: "soil", id: 15 },
                { hanzi: "上", image: "up", id: 16 },
                { hanzi: "下", image: "down", id: 17 },
                { hanzi: "中", image: "middle", id: 18 },
                { hanzi: "目", image: "eye", id: 19 },
                { hanzi: "手", image: "hand", id: 20 },
            ];
 const $=id=>document.getElementById(id),board=$('game-board');
 let cards=[],flippedCards=[],matchedPairs=0,currentScore=0,currentAttempts=0,lockBoard=false,pairCount=6,version=0,timers=[],activeData=[];
 function refresh(){window.KrisI18n?.refresh();}
 function schedule(fn,delay){const generation=version;timers.push(setTimeout(()=>{if(generation===version)fn();},delay));}
 function hideCard(card){card.classList.remove('flipped');card.querySelector('.card-front').setAttribute('aria-hidden','true');card.setAttribute('aria-label',`未翻开的卡片 ${card.dataset.position}`);}
 function update(){ $('score').textContent=currentScore;$('attempts').textContent=currentAttempts;}
 function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
 function initializeGame(){version++;timers.forEach(clearTimeout);timers=[];cards=[];flippedCards=[];matchedPairs=0;currentScore=0;currentAttempts=0;lockBoard=false;board.innerHTML='';board.classList.remove('board-locked');$('win-message').style.display='none';$('memory-collection').innerHTML='';$('memory-status').textContent='先翻汉字或图片，再寻找它的朋友。';update();activeData=shuffle(gameData.slice()).slice(0,pairCount);board.style.gridTemplateColumns='repeat(auto-fit, minmax(70px, 1fr))';
 const generation=version;shuffle(activeData.flatMap(item=>[{...item,type:'hanzi'},{...item,type:'image'}])).forEach((item,i)=>{const card=document.createElement('button');card.type='button';card.className='card';card.dataset.id=item.id;card.dataset.type=item.type;card.dataset.position=i+1;card.setAttribute('aria-label',`未翻开的卡片 ${i+1}`);
 const front=document.createElement('div');front.className='card-face card-front';front.setAttribute('translate','no');front.setAttribute('lang','zh');front.setAttribute('aria-hidden','true');if(item.type==='hanzi')front.textContent=item.hanzi;else front.innerHTML=`<img src="../assets/learning-pictures/${item.image}.svg" alt="${item.hanzi}" width="160" height="160">`;
 const back=document.createElement('div');back.className='card-face card-back';back.setAttribute('aria-hidden','true');card.appendChild(front);card.appendChild(back);card.addEventListener('click',()=>{if(generation===version)handleCardClick(card,item);});cards.push(card);board.appendChild(card);});refresh();}
 function handleCardClick(card,item){if(lockBoard||card.classList.contains('flipped')||card.classList.contains('matched')||!cards.includes(card))return;card.classList.add('flipped');card.querySelector('.card-front').setAttribute('aria-hidden','false');card.setAttribute('aria-label',(item.type==='hanzi'?'汉字卡: ':'图片卡: ')+item.hanzi);flippedCards.push(card);
 if(flippedCards.length<2){$('memory-status').textContent='再翻一张，找出配对。';refresh();return;}
 currentAttempts++;lockBoard=true;board.classList.add('board-locked');const [a,b]=flippedCards;
 if(a.dataset.id===b.dataset.id){a.classList.add('matched');b.classList.add('matched');a.disabled=true;b.disabled=true;matchedPairs++;currentScore+=10;const stamp=document.createElement('span');stamp.textContent=item.hanzi;$('memory-collection').appendChild(stamp);$('memory-status').textContent=`找到 ${matchedPairs} / ${pairCount} 对！`;flippedCards=[];schedule(()=>{lockBoard=false;board.classList.remove('board-locked');},200);
 if(matchedPairs===pairCount){$('final-attempts').textContent=currentAttempts;$('win-message').style.display='flex';$('play-again-button').focus();}}
 else{$('memory-status').textContent='记住这两个位置，再试一次。';schedule(()=>{hideCard(a);hideCard(b);flippedCards=[];lockBoard=false;board.classList.remove('board-locked');a.focus();refresh();},1000);}
 update();refresh();}
 for(const n of [6,12,20])$('pairs-'+n).addEventListener('click',()=>{if(pairCount===n)return;pairCount=n;for(const size of [6,12,20])$('pairs-'+size).setAttribute('aria-pressed',String(size===n));initializeGame();board.querySelector('button')?.focus();});
 $('restart-button').addEventListener('click',initializeGame);$('play-again-button').addEventListener('click',()=>{initializeGame();board.querySelector('button')?.focus();});
 window.addEventListener('pagehide',()=>{version++;timers.forEach(clearTimeout);});window.addEventListener('pageshow',e=>{if(e.persisted)initializeGame();});initializeGame();
});

</script>
<kris-reviews data-game="chinese_game1"></kris-reviews></body>
</html>
