<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉字寻宝翻翻乐</title>
    <style>
        body {
            font-family: 'KaiTi', '楷体', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f8ff; /* 淡蓝色背景 */
            color: #333;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #ff6347; /* 番茄色 */
        }

        .game-board {
            display: grid;
            /* 列数和行数会由JS根据卡片数量调整 */
            grid-template-columns: repeat(5, 100px); /* 默认值，JS会覆盖 */
            gap: 10px;
            perspective: 1000px; /* 为了3D翻转效果 */
        }

        .card {
            width: 100px;
            height: 100px;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card.flipped, .card.matched {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* 隐藏背面 */
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 2em; /* 调整汉字大小 */
            overflow: hidden; /* 防止图片溢出 */
        }

        .card-front {
            background-color: #fff;
            color: #333;
            transform: rotateY(180deg); /* 正面先转过去 */
        }

        .card-front img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        .card-back {
            background-color: #4682b4; /* 钢蓝色 */
            color: white;
            /* 可以用SVG或图片做卡片背面图案, 例如: */
            /* background-image: url('images/card_back_pattern.svg'); */
            /* background-size: cover; */
        }
        .card-back::before { /* 简单的问号图案 */
            content: '?';
            font-size: 2.5em;
            font-weight: bold;
        }

        /* 防止在翻转检查期间快速点击 */
        .board-locked .card:not(.matched) {
            pointer-events: none;
        }

        button {
            padding: 10px 20px;
            font-size: 1em;
            color: white;
            background-color: #5cb85c; /* 成功绿色 */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #4cae4c;
        }

        .win-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            z-index: 100;
        }

        .win-message h2 {
            color: #ff6347;
        }
    </style>
<script defer src="../assets/reviews/config.js?v=09163975f7cc"></script><script defer src="../assets/reviews/reviews.js?v=6b47f21a62b6"></script>
<link rel="stylesheet" href="../assets/i18n.css?v=66e8355ff2fe">
<script src="../assets/i18n.js?v=4bcf2a93334a"></script>
<script src="../assets/i18n-site.js?v=a70fdf15f66e"></script>
<script src="../assets/i18n-legacy-learning.js?v=0fc0d75b31ab"></script>
<script src="../assets/chinese-bank.js?v=cec5c3289b40"></script>
<script src="../assets/i18n-reviews.js?v=b8628bc427aa"></script>
<link rel="stylesheet" href="../assets/learning-worlds.css?v=517a195cc990">
</head>
<body class="learning-world memory-world">
    <div class="header">
        <a class="home-link" href="../index.html">返回首页</a>
        <h1>汉字寻宝翻翻乐</h1><span class="world-icon" aria-hidden="true">🏮</span>
        <p class="world-intro">先看图认识汉字，再找朋友。不用先会读中文，英文和法文会帮你。</p>
        <p id="memory-bank-note" class="beginner-note" hidden>词库暂时没加载，先玩这四个入门词。刷新可重试。</p>
        <div class="world-controls" aria-label="卡片数量">
            <button id="pairs-4" aria-pressed="true">4 对 · 从这里开始</button>
            <button id="pairs-6" aria-pressed="false">6 对 · 想多玩一点</button>
            <button id="pairs-12" aria-pressed="false">12 对 · 自选挑战</button>
            <button id="pairs-20" aria-pressed="false">20 对 · 自选挑战</button>
        </div>
        <section id="memory-study" class="beginner-study" aria-labelledby="memory-study-title">
            <h2 id="memory-study-title">先认识这些词</h2>
            <p>看图片、汉字和意思。准备好了，再开始。随时都可以回来看。</p>
            <div id="memory-study-cards" class="beginner-study-grid"></div>
            <button id="memory-start" class="world-action">准备好了，开始配对</button>
        </section>
        <button id="memory-review" class="world-action" hidden>再看词卡</button>
        <div id="memory-collection" translate="no" lang="zh"></div><p id="memory-status" role="status" aria-live="polite"></p>
        <p>得分: <span id="score">0</span> | 尝试次数: <span id="attempts">0</span></p>
        <button id="restart-button">重新开始</button>
    </div>

    <div id="game-board" class="game-board">
        <!-- 卡片将由JavaScript动态生成 -->
    </div>

    <div id="win-message" class="win-message" style="display: none;">
        <h2>恭喜你！全部找到了！</h2>
        <p>尝试次数: <span id="final-attempts"></span></p>
        <button id="play-again-button">再玩一次</button>
    </div>

    <script>

document.addEventListener('DOMContentLoaded',()=>{
 const fallback=[
  {id:'fallback-water',hanzi:'水',pinyin:'shuǐ',en:'water',fr:'eau',picture:'water',cue:'💧'},
  {id:'fallback-fire',hanzi:'火',pinyin:'huǒ',en:'fire',fr:'feu',picture:'fire',cue:'🔥'},
  {id:'fallback-sun',hanzi:'太阳',pinyin:'tài yáng',en:'sun',fr:'soleil',picture:'sun',cue:'☀️'},
  {id:'fallback-moon',hanzi:'月亮',pinyin:'yuè liang',en:'moon',fr:'lune',picture:'moon',cue:'🌙'}
 ];
 const pictureOrder=['water','fire','sun','moon','one','two','three','person','mouth','big','small','mountain','tree','field','soil','up','down','middle','eye','hand'];
 const entries=window.KrisChineseBank?.entries||[],gameData=pictureOrder.map(picture=>entries.find(entry=>entry.picture===picture)).filter(Boolean);
 if(gameData.length<4){gameData.splice(0,gameData.length,...fallback);document.getElementById('memory-bank-note').hidden=false;}
 const $=id=>document.getElementById(id),board=$('game-board');
 let cards=[],flippedCards=[],matchedPairs=0,currentScore=0,currentAttempts=0,lockBoard=false,pairCount=4,version=0,timers=[],activeData=[],studying=true,started=false;
 const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
 function refresh(){window.KrisI18n?.refresh();}
 function wordText(item){return `<span class="beginner-hanzi" lang="zh">${esc(item.hanzi)}</span><span class="beginner-pinyin" lang="zh-Latn">${esc(item.pinyin)}</span>`;}
 function meanings(item){return `<span class="beginner-meaning" lang="en">${esc(item.en)}</span><span class="beginner-meaning" lang="fr">${esc(item.fr)}</span>`;}
 function art(item){return `<span class="learning-picture-art"><img src="../assets/learning-pictures/${esc(item.picture)}.svg" alt="" width="160" height="160"><span class="beginner-picture-fallback" aria-hidden="true" hidden>${esc(item.cue||'🖼️')}</span></span>`;}
 function wirePictures(root){root.querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>{img.hidden=true;img.parentElement.querySelector('.beginner-picture-fallback').hidden=false;}));}
 function schedule(fn,delay){const generation=version;timers.push(setTimeout(()=>{if(generation===version)fn();},delay));}
 function hideCard(card){card.classList.remove('flipped');card.querySelector('.card-front').setAttribute('aria-hidden','true');card.setAttribute('aria-label',`未翻开的卡片 ${card.dataset.position}`);}
 function update(){ $('score').textContent=currentScore;$('attempts').textContent=currentAttempts;}
 function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
 function setStudy(show){studying=show;$('memory-study').hidden=!show;board.hidden=!started||show;$('memory-review').hidden=!started||show;}
 function initializeGame(){
  version++;timers.forEach(clearTimeout);timers=[];cards=[];flippedCards=[];matchedPairs=0;currentScore=0;currentAttempts=0;lockBoard=false;started=false;
  board.innerHTML='';board.classList.remove('board-locked');$('win-message').style.display='none';$('memory-collection').innerHTML='';$('memory-status').textContent='先看词卡，准备好了再开始。';update();
  // A tiny, repeatable first set. Extra pairs are an optional learner choice.
  activeData=gameData.slice(0,pairCount);board.dataset.pairs=String(activeData.length);
  $('memory-study-cards').innerHTML=activeData.map(item=>`<article class="beginner-word-card" translate="no">${art(item)}${wordText(item)}${meanings(item)}</article>`).join('');wirePictures($('memory-study-cards'));setStudy(true);
  const generation=version;
  shuffle(activeData.flatMap(item=>[{...item,type:'hanzi'},{...item,type:'image'}])).forEach((item,i)=>{
   const card=document.createElement('button');card.type='button';card.className='card';card.dataset.id=item.id;card.dataset.type=item.type;card.dataset.position=i+1;card.setAttribute('aria-label',`未翻开的卡片 ${i+1}`);
   const front=document.createElement('div');front.className='card-face card-front';front.setAttribute('translate','no');front.setAttribute('aria-hidden','true');front.innerHTML=item.type==='hanzi'?wordText(item)+meanings(item):art(item)+meanings(item);
   const back=document.createElement('div');back.className='card-face card-back';back.setAttribute('aria-hidden','true');card.appendChild(front);card.appendChild(back);card.addEventListener('click',()=>{if(generation===version)handleCardClick(card,item);});cards.push(card);board.appendChild(card);
  });wirePictures(board);refresh();
 }
 function handleCardClick(card,item){
  if(studying||!started||lockBoard||card.classList.contains('flipped')||card.classList.contains('matched')||!cards.includes(card))return;
  card.classList.add('flipped');card.querySelector('.card-front').setAttribute('aria-hidden','false');card.setAttribute('aria-label',(item.type==='hanzi'?'汉字卡: ':'图片卡: ')+item.hanzi+' · '+item.en+' · '+item.fr);flippedCards.push(card);
  if(flippedCards.length<2){$('memory-status').textContent='再翻一张，找出配对。';refresh();return;}
  currentAttempts++;lockBoard=true;board.classList.add('board-locked');const [a,b]=flippedCards;
  if(a.dataset.id===b.dataset.id){
   a.classList.add('matched');b.classList.add('matched');a.disabled=true;b.disabled=true;matchedPairs++;currentScore+=10;
   const stamp=document.createElement('span');stamp.textContent=item.hanzi;stamp.title=item.en+' · '+item.fr;$('memory-collection').appendChild(stamp);$('memory-status').textContent=`找到 ${matchedPairs} / ${activeData.length} 对！`;flippedCards=[];
   schedule(()=>{lockBoard=false;board.classList.remove('board-locked');},200);
   if(matchedPairs===activeData.length){$('final-attempts').textContent=currentAttempts;$('win-message').style.display='flex';$('play-again-button').focus();}
  }else{
   $('memory-status').textContent='记住这两个位置，再试一次。';schedule(()=>{hideCard(a);hideCard(b);flippedCards=[];lockBoard=false;board.classList.remove('board-locked');if(!studying)a.focus();refresh();},1400);
  }
  update();refresh();
 }
 for(const n of [4,6,12,20]){
  $('pairs-'+n).disabled=n>gameData.length;
  $('pairs-'+n).addEventListener('click',()=>{if(pairCount===n||n>gameData.length)return;pairCount=n;for(const size of [4,6,12,20])$('pairs-'+size).setAttribute('aria-pressed',String(size===n));initializeGame();$('memory-start').focus();});
 }
 $('memory-start').addEventListener('click',()=>{if(!studying)return;started=true;setStudy(false);$('memory-status').textContent='先翻汉字或图片，再寻找它的朋友。';board.querySelector('button:not([disabled])')?.focus();refresh();});
 $('memory-review').addEventListener('click',()=>{setStudy(true);$('memory-start').focus();});
 $('restart-button').addEventListener('click',initializeGame);$('play-again-button').addEventListener('click',()=>{initializeGame();$('memory-start').focus();});
 window.addEventListener('pagehide',()=>{version++;timers.forEach(clearTimeout);});window.addEventListener('pageshow',e=>{if(e.persisted)initializeGame();});initializeGame();
});

</script>
<kris-reviews data-game="chinese_game1"></kris-reviews></body>
</html>
