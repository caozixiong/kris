<title>词汇测验</title>
<style>
  body {
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    box-sizing: border-box;
    padding-bottom: 24px;
    margin: 0;
    background-color: #f0f0f0;
  }
  .container {
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    text-align: center;
    width: min(480px, calc(100vw - 64px));
    margin: 20px 12px;
  }
  button, a { touch-action: manipulation; }
  button { min-height: 44px; }
  button:focus-visible, a:focus-visible, #word:focus-visible {
    outline: 3px solid #723ac4;
    outline-offset: 3px;
  }
  .home-link { display: inline-block; margin-bottom: 8px; color: #1657a3; }
  .quiz-modes { display: flex; gap: 8px; flex-wrap: wrap; }
  .quiz-modes button {
    flex: 1 1 170px; padding: 10px; border: 2px solid #b8c8dd;
    border-radius: 8px; background: #f0f5fb; color: #183b66;
    font: inherit; cursor: pointer;
  }
  .quiz-modes button[aria-pressed="true"] { border-color: #1657a3; background: #dbeaff; font-weight: bold; }
  .quiz-modes button:disabled { opacity: .6; cursor: not-allowed; }
  .quiz-description { line-height: 1.5; color: #4a5568; }
  .quiz-stats { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
  #bank-status { color: #884100; line-height: 1.5; }
  #word {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 20px;
    overflow-wrap: anywhere;
  }
  .options button {
    display: block;
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
    background-color: #e7e7e7;
    font-size: 16px;
    text-align: left;
  }
  .options button:disabled { cursor: default; }
  .options button:hover:not(:disabled) {
    background-color: #d7d7d7;
  }
  .options button.selected {
    background-color: #0866c7;
    color: white;
    border-color: #0056b3;
  }
  .action-buttons button {
    padding: 10px 15px;
    margin: 10px 5px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    background-color: #197b35;
    color: white;
    font-size: 16px;
  }
  .action-buttons button:hover {
    background-color: #1e7e34;
  }
  .action-buttons button#next-word {
    background-color: #0866c7;
  }
  .action-buttons button#next-word:hover {
    background-color: #0056b3;
  }
  #message {
    margin-top: 15px;
    font-size: 18px;
    min-height: 25px; /* Reserve space for the message */
  }
  .correct {
    color: green;
  }
  .incorrect {
    color: red;
  }
</style>

<body class="learning-world word-world">

<main class="container">
  <a class="home-link" href="index.html">返回首页</a>
  <h1>词汇测验</h1><span class="world-icon" aria-hidden="true">🧳</span><p class="world-intro">带着词语护照去旅行！每五个词到达一站，最后可以重练需要帮助的词。</p><div id="word-passport" class="journey-trail" aria-label="词语护照"></div><p id="passport-note"></p>
  <div class="quiz-modes" role="group" aria-label="练习模式">
    <button type="button" id="mode-translation" aria-pressed="true" onclick="setQuizMode('translation')">英译法 · 共享词库</button>
    <button type="button" id="mode-definition" aria-pressed="false" onclick="setQuizMode('definition')">原版英语释义 · 15 词</button>
  </div>
  <p id="quiz-description" class="quiz-description"></p>
  <p id="bank-status" role="status" hidden></p>
  <div class="quiz-stats">
    <span id="quiz-progress"></span>
    <span id="quiz-score"></span>
  </div>
  <div id="word" tabindex="-1"></div>
  <div class="options" id="options" role="group" aria-label="答案选项" aria-describedby="word"></div>
  <button class="world-action" id="review-words" hidden onclick="reviewMissedWords()">重练这些词</button><div class="action-buttons">
    <button type="button" id="check-answer" onclick="checkAnswer()">检查答案</button>
    <button type="button" id="next-word" onclick="nextWord()">下一个单词</button>
  </div>
  <div id="message" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript>请启用 JavaScript 来玩词汇测验。</noscript>
</main>

<script>
  const vocabulary = [
    { word: "Apple", definition: "A round fruit with red or green skin.", distractors: ["A yellow, long fruit", "A type of vegetable"] },
    { word: "Ball", definition: "A round object used in games.", distractors: ["A pointy toy", "Something you read"] },
    { word: "Book", definition: "Pages with words and pictures.", distractors: ["Something you wear", "A type of food"] },
    { word: "Cat", definition: "A small animal with fur, whiskers, and a tail.", distractors: ["A farm animal that says 'moo'", "A flying animal with feathers"] },
    { word: "Dog", definition: "A common pet animal that barks.", distractors: ["An animal that swims in the ocean", "A very tall animal with a long neck"] },
    { word: "Sun", definition: "The star that gives us light and warmth.", distractors: ["The planet we live on", "A light you use at night"] },
    { word: "Run", definition: "To move fast using your legs.", distractors: ["To sleep quietly", "To eat slowly"] },
    { word: "Big", definition: "Large in size.", distractors: ["Very small", "The color red"] },
    { word: "Happy", definition: "Feeling good and cheerful.", distractors: ["Feeling sad", "Feeling sleepy"] },
    { word: "Tree", definition: "A tall plant with a trunk and branches.", distractors: ["A small, colorful flower", "A flat, green field"] },
    { word: "Water", definition: "A clear liquid that we drink.", distractors: ["A sweet, fizzy drink", "A hot, brown drink"] },
    { word: "House", definition: "A building where people live.", distractors: ["A place to buy food", "A place to see movies"] },
    { word: "Jump", definition: "To push off the ground with your feet.", distractors: ["To sit very still", "To write with a pencil"] },
    { word: "Friend", definition: "Someone you like and enjoy being with.", distractors: ["A type of teacher", "A toy you play with alone"] },
    { word: "School", definition: "A place where children learn.", distractors: ["A place to play sports all day", "A store that sells toys"] }
  ];

  const sharedWords = window.KrisWordBank?.words || [];
  const translationAvailable = sharedWords.length >= 3;
  let quizMode = translationAvailable ? 'translation' : 'definition';
  let roundWords = [];
  let currentWordIndex = 0;
  let correctAnswer = '';
  let selectedOptionButton = null;
  let quizFinished = false;
  let answerChecked = false;
  let correctCount = 0;
  let questionVersion = 0;
  let wordOutcomes = [], missedWords = [];
  function updatePassport() {
    document.getElementById('word-passport').innerHTML = roundWords.map((entry,i) => `<span class="journey-stop ${wordOutcomes[i] === true ? 'earned' : ''} ${i === currentWordIndex && !quizFinished ? 'current' : ''}">${wordOutcomes[i] === true ? '★' : i + 1}</span>`).join('');
    document.getElementById('passport-note').textContent = `旅行站点 ${Math.min(Math.floor(currentWordIndex / 5) + 1, Math.ceil(roundWords.length / 5))} / ${Math.ceil(roundWords.length / 5)}`;
    document.getElementById('review-words').hidden = !quizFinished || missedWords.length === 0;
  }
  function reviewMissedWords() {
    if (!quizFinished || !missedWords.length) return;
    roundWords = missedWords.slice(); missedWords = []; wordOutcomes = [];
    currentWordIndex = 0; correctCount = 0; quizFinished = false;
    document.getElementById('quiz-description').textContent = `再练 ${roundWords.length} 个词，把它们记得更牢！`;
    displayWord(true);
  }

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function normalizeLabel(value) {
    return String(value).normalize('NFC').toLocaleLowerCase().replace(/[’‘]/g, "'").replace(/\s+/g, ' ').trim();
  }

  function translationDistractors(entry) {
    // Prefer matching word type and topic. If a future bank has a rare type,
    // borrow other types only when needed to keep every entry playable.
    const allowed = sharedWords.filter(candidate => candidate.id !== entry.id &&
      normalizeLabel(candidate.en) !== normalizeLabel(entry.en) &&
      normalizeLabel(candidate.fr) !== normalizeLabel(entry.fr) &&
      normalizeLabel(candidate.lemmaFr || candidate.fr) !== normalizeLabel(entry.lemmaFr || entry.fr));
    const groups = [
      allowed.filter(candidate => candidate.pos === entry.pos && candidate.theme === entry.theme),
      allowed.filter(candidate => candidate.pos === entry.pos && candidate.theme !== entry.theme),
      allowed.filter(candidate => candidate.pos !== entry.pos)
    ];
    const seen = new Set([normalizeLabel(entry.fr)]), chosen = [];
    for (const group of groups) {
      for (const candidate of shuffleArray(group)) {
        const label = normalizeLabel(candidate.fr);
        if (seen.has(label)) continue;
        seen.add(label);
        chosen.push(candidate);
        if (chosen.length === 2) return chosen;
      }
    }
    return chosen;
  }

  function refreshQuizText() {
    updatePassport();
    window.KrisI18n?.refresh();
  }

  function setQuizMode(mode) {
    if (!['translation', 'definition'].includes(mode) || (mode === 'translation' && !translationAvailable)) return;
    if (quizMode === mode && roundWords.length) return;
    quizMode = mode;
    startQuiz(true);
  }

  function startQuiz(focusQuestion = false) {
    roundWords = quizMode === 'translation' ? window.KrisWordBank.sample(Math.min(15, sharedWords.length)) : vocabulary.slice();
    currentWordIndex = 0;
    wordOutcomes = []; missedWords = [];
    correctCount = 0;
    quizFinished = false;
    document.getElementById('mode-translation').setAttribute('aria-pressed', String(quizMode === 'translation'));
    document.getElementById('mode-definition').setAttribute('aria-pressed', String(quizMode === 'definition'));
    document.getElementById('mode-translation').disabled = !translationAvailable;
    const status = document.getElementById('bank-status');
    status.hidden = translationAvailable;
    status.textContent = translationAvailable ? '' : '共享词库未能加载。你仍可练习原版 15 词；刷新页面可重试。';
    document.getElementById('quiz-description').textContent = quizMode === 'translation' ?
      `从 ${sharedWords.length} 个英法词汇中随机抽取 ${roundWords.length} 题。请选择对应的法语。` :
      '原版练习：为 15 个英语单词选择正确的英语释义。';
    displayWord(focusQuestion);
  }

  function displayWord(focusQuestion = false) {
    questionVersion++;
    answerChecked = false;
    selectedOptionButton = null;
    const word = document.getElementById('word');
    const optionsContainer = document.getElementById('options');
    const message = document.getElementById('message');
    optionsContainer.innerHTML = '';
    message.textContent = '';
    message.className = '';
    document.getElementById('quiz-score').textContent = `答对: ${correctCount} / ${roundWords.length}`;
    document.getElementById('quiz-progress').textContent = `题目: ${Math.min(currentWordIndex + 1, roundWords.length)} / ${roundWords.length}`;

    if (currentWordIndex >= roundWords.length) {
      quizFinished = true;
      correctAnswer = '';
      word.removeAttribute('translate');
      word.removeAttribute('lang');
      word.textContent = '测验完成！';
      message.textContent = '你已完成所有单词！';
      document.getElementById('check-answer').style.display = 'none';
      document.getElementById('next-word').textContent = '重新测验';
      refreshQuizText();
      if (focusQuestion) document.getElementById('next-word').focus();
      return;
    }

    quizFinished = false;
    word.setAttribute('translate', 'no');
    word.setAttribute('lang', 'en');
    document.getElementById('check-answer').style.display = 'inline-block';
    document.getElementById('check-answer').disabled = false;
    document.getElementById('next-word').textContent = '下一个单词';
    const currentEntry = roundWords[currentWordIndex];
    let options;
    if (quizMode === 'translation') {
      word.textContent = currentEntry.en;
      correctAnswer = currentEntry.fr;
      options = [currentEntry, ...translationDistractors(currentEntry)].map(entry => ({ label: entry.fr, id: entry.id }));
    } else {
      word.textContent = currentEntry.word;
      correctAnswer = currentEntry.definition;
      options = [currentEntry.definition, ...currentEntry.distractors].map(label => ({ label }));
    }

    const version = questionVersion;
    shuffleArray(options).forEach(option => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = option.label;
      button.dataset.answer = option.label;
      if (option.id) button.dataset.wordId = option.id;
      button.setAttribute('translate', 'no');
      button.setAttribute('lang', quizMode === 'translation' ? 'fr' : 'en');
      button.setAttribute('aria-pressed', 'false');
      button.onclick = () => {
        if (version === questionVersion) selectOption(button, option.label);
      };
      optionsContainer.appendChild(button);
    });
    refreshQuizText();
    if (focusQuestion) optionsContainer.querySelector('button')?.focus();
  }

  function selectOption(buttonElement, optionText) {
    if (quizFinished || answerChecked || !document.getElementById('options').contains(buttonElement)) return;
    if (selectedOptionButton) {
      selectedOptionButton.classList.remove('selected');
      selectedOptionButton.setAttribute('aria-pressed', 'false');
    }
    selectedOptionButton = buttonElement;
    selectedOptionButton.classList.add('selected');
    selectedOptionButton.setAttribute('aria-pressed', 'true');
    document.getElementById('message').textContent = '';
  }

  function checkAnswer() {
    if (quizFinished || answerChecked) return;
    const messageElement = document.getElementById('message');
    if (!selectedOptionButton) {
      messageElement.textContent = '请选择一个选项。';
      messageElement.className = 'incorrect';
      document.querySelector('#options button')?.focus();
      refreshQuizText();
      return;
    }

    answerChecked = true;
    const userAnswer = selectedOptionButton.dataset.answer;
    if (userAnswer === correctAnswer) {
      correctCount++;
      messageElement.textContent = '正确！';
      messageElement.className = 'correct';
    } else {
      messageElement.textContent = `不正确。正确答案是：“${correctAnswer}”`;
      messageElement.className = 'incorrect';
    }
    wordOutcomes[currentWordIndex] = userAnswer === correctAnswer;
    document.querySelectorAll('#options button').forEach(button => { button.disabled = true; button.classList.toggle('revealed-correct',button.dataset.answer === correctAnswer); });
    document.getElementById('check-answer').disabled = true;
    document.getElementById('quiz-score').textContent = `答对: ${correctCount} / ${roundWords.length}`;
    refreshQuizText();
    document.getElementById('next-word').focus();
  }

  function nextWord() {
    if (quizFinished) {
      startQuiz(true);
      return;
    }
    if (wordOutcomes[currentWordIndex] !== true) missedWords.push(roundWords[currentWordIndex]);
    currentWordIndex++;
    displayWord(true);
  }

  // Interface-language changes only translate text, never resample the round.
  window.onload = () => startQuiz();
</script>

<kris-reviews data-game="vocabulary_quiz"></kris-reviews></body>
</html>
