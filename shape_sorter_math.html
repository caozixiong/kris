<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>形状加减法</title>
    <style>
        body {
            font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #87CEEB; /* Sky Blue */
            overflow-x: hidden; overflow-y: auto; /* Prevent scrollbars from appearing during animations */
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 800px;
            min-height: 600px;
            height: auto;
            background-color: #f0f8ff; /* AliceBlue */
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .mode-switcher {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding-right: 42px;
        }

        .mode-button {
            padding: 10px 15px;
            font-size: 16px;
            font-family: inherit;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            background-color: #ddd;
            color: #333;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .mode-button.active {
            background-color: #007bff; /* Blue */
            color: white;
            border-color: #0056b3;
        }
        .mode-button:hover:not(.active) {
            background-color: #ccc;
        }


        .target-section {
            background-color: #ffd700; /* Gold */
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 10px; /* Reduced margin */
            text-align: center;
        }
        
        .target-section #target-label {
            font-size: 18px;
            display: block;
            color: #555;
        }

        #target-number, #initial-sum-display, #current-sum-display-subtraction { /* Shared styling for main numbers */
            font-size: 38px; /* Slightly reduced for more text */
            font-weight: bold;
            color: #333;
        }
        
        .subtraction-info {
            font-size: 18px;
            color: #444;
            margin: 5px 0;
        }


        .sorting-machine-area {
            width: 250px; /* Increased size for subtraction mode */
            height: 250px; /* Increased size for subtraction mode */
            background-color: #A9A9A9; /* DarkGray */
            border: 5px dashed #696969; /* DimGray */
            border-radius: 15px;
            display: flex;
            /* align-items: center;  Default, will be overridden for subtraction */
            /* justify-content: center; Default, will be overridden for subtraction */
            margin-bottom: 20px; /* Reduced margin */
            position: relative; /* For feedback elements */
            overflow: hidden; /* For animations */
            flex-wrap: wrap; /* Allow shapes to wrap in subtraction mode */
            padding: 10px; /* Padding for shapes inside */
            box-sizing: border-box;
        }

        .sorting-machine-area.accepting {
            border-color: #32CD32; /* LimeGreen */
        }
        .sorting-machine-area.rejecting {
            animation: shake 0.3s;
            border-color: #FF0000; /* Red */
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        .shapes-display-area { /* Used for Addition mode's shape pool */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 10px;
            background-color: #add8e6; /* LightBlue */
            border-radius: 10px;
            width: 100%;
            min-height: 120px; /* Slightly increased height */
            box-sizing: border-box;
        }

        .shape { /* Base style for all shapes */
            width: 55px; /* Slightly smaller for more shapes in machine */
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px; /* Adjusted for smaller shape */
            font-weight: bold;
            color: white;
            user-select: none; /* Prevent text selection */
            transition: transform 0.1s ease-out, box-shadow 0.1s ease-out, opacity 0.2s ease-out;
        }
        .shape.draggable { /* For addition mode */
            cursor: grab;
        }
        .shape.clickable { /* For subtraction mode */
            cursor: pointer;
            margin: 5px; /* Spacing for shapes inside machine */
        }
        .shape.dragging {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            cursor: grabbing;
            opacity: 0.7;
        }
        .shape.removed {
            opacity: 0;
            transform: scale(0.5);
        }


        .circle {
            background-color: #FF6347; /* Tomato */
            border-radius: 50%;
        }

        .square {
            background-color: #4682B4; /* SteelBlue */
            border-radius: 5px;
        }

        .triangle {
            width: 0;
            height: 0;
            border-left: 27.5px solid transparent; /* Adjusted for 55px size */
            border-right: 27.5px solid transparent;
            border-bottom: 55px solid #32CD32; /* LimeGreen */
            background-color: transparent !important; /* Override shape's default bg */
            position: relative;
        }
        .triangle span { /* Number inside triangle */
            position: absolute;
            top: 27.5px; /* Adjust based on triangle size */
            left: 50%;
            transform: translate(-50%, -50%);
            color: #333; /* Darker color for visibility on green */
        }

        #feedback-message {
            position: absolute;
            top: 60%; /* Adjusted due to larger machine */
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 70px; /* Slightly smaller */
            display: none; /* Hidden by default */
            animation: pop-in-out 1.5s;
            z-index: 10; /* Ensure it's on top */
        }

        @keyframes pop-in-out {
            0%, 100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            25% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            75% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .machine-content { /* For addition mode's "Drop here! Sum: X" */
            font-size: 18px; /* Adjusted */
            color: white;
            text-align: center;
        }
        .machine-sum { /* For addition mode sum display */
            font-size: 26px; /* Adjusted */
            font-weight: bold;
        }

        #reset-button {
            position: absolute;
            top: 15px; /* Adjusted for mode switcher */
            right: 15px;
            width: 45px; /* Slightly larger */
            height: 45px;
            background-color: #ffc107; /* Amber */
            color: #333;
            border: none;
            border-radius: 50%;
            font-size: 28px; /* Adjusted */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        #reset-button:hover {
            background-color: #e0a800;
        }
    </style>

<script src="assets/i18n.js?v=4bcf2a93334a"></script>
<script src="assets/i18n-site.js?v=a70fdf15f66e"></script>
<script src="assets/i18n-legacy-learning.js?v=473e400a1a8a"></script>

</head>
<body class="learning-world shape-world">

<div class="game-container"><a class="home-link" href="index.html">返回首页</a><h1>形状加减法</h1><span class="world-icon" aria-hidden="true">🤖</span><p class="world-intro">喂饱数字机器人！点击或拖动积木，让总数正好等于目标。走错一步可以撤回。</p><div id="shape-stamps" class="journey-trail" aria-label="机器人徽章"></div>
    <div class="mode-switcher">
        <button id="addition-mode-btn" class="mode-button active">加法模式</button>
        <button id="subtraction-mode-btn" class="mode-button">减法模式</button>
    </div>

    <div class="target-section">
        <span id="target-label">目标总和</span>
        <span id="target-number">5</span>
        <div id="subtraction-details" style="display: none;">
            <span class="subtraction-info">初始总和: <span id="initial-sum-display">0</span></span>
            <span class="subtraction-info">当前总和: <span id="current-sum-display-subtraction">0</span></span>
        </div>
    </div>

    <div class="sorting-machine-area" id="sorting-machine">
        <!-- Content dynamically changes: "Drop here" or shapes for subtraction -->
        <div class="machine-content" id="machine-text-content">拖到这里！ <span id="current-sum-display-addition">总和: 0</span></div>
    </div>

    <p id="machine-equation" aria-live="polite"></p><div id="feedback-message" role="status" aria-live="polite"></div><div class="world-controls"><button id="undo-shape" disabled>撤回一步</button><button id="shape-next" hidden>下一题</button></div>

    <div class="shapes-display-area" id="shapes-area">
        <!-- Shapes for addition mode will be dynamically generated here -->
    </div>

    <button id="reset-button" title="新题目" aria-label="新题目">&#x21bb;</button> <!-- Unicode for reload arrow -->
</div>

<script>

const $=id=>document.getElementById(id),sortingMachine=$('sorting-machine'),shapesArea=$('shapes-area');
let currentGameMode='addition',targetSum=0,currentSumInMachineAddition=0,initialSumSubtraction=0,currentSumSubtraction=0,draggableShapes=[],shapesInMachineSubtraction=[],shapeHistory=[],shapeSolved=false,shapeStamps=0,shapeVersion=0,shapeSerial=0;
const shapeTypes=[{type:'circle',color:'#bc4d38'},{type:'square',color:'#326b91'},{type:'triangle',color:'#27773c'}];
function getRandomInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function refreshShape(){window.KrisI18n?.refresh();}
function createShapeElement(info,value,prefix='shape'){const b=document.createElement('button');b.type='button';b.className='shape '+info.type;b.id=prefix+'-'+(++shapeSerial);b.dataset.value=value;b.style.backgroundColor=info.color;b.setAttribute('aria-label',`数值 ${value} 的积木`);const n=document.createElement('span');n.textContent=value;b.appendChild(n);return b;}
function updateAdditionSumDisplay(){const s=$('current-sum-display-addition');if(s)s.textContent=`总和: ${currentSumInMachineAddition}`;}
function updateSubtractionSumDisplay(){$('current-sum-display-subtraction').textContent=currentSumSubtraction;}
function updateShapeUI(){const value=currentGameMode==='addition'?currentSumInMachineAddition:currentSumSubtraction;const goalGap=currentGameMode==='addition'?targetSum-value:value-targetSum;$('machine-equation').textContent=currentGameMode==='addition'?`0${shapeHistory.map(s=>' + '+s.value).join('')} = ${value}`:`${initialSumSubtraction}${shapeHistory.map(s=>' − '+s.value).join('')} = ${value}`;$('feedback-message').style.display='block';$('feedback-message').textContent=shapeSolved?'机器人充满能量！':`还差 ${goalGap}，继续试一试。`;$('feedback-message').style.color=shapeSolved?'#17634d':'#294b5a';$('undo-shape').disabled=!shapeHistory.length||shapeSolved;$('shape-next').hidden=!shapeSolved;$('shape-stamps').innerHTML=Array.from({length:Math.min(6,shapeStamps)},()=>'<span class="journey-stop earned" aria-hidden="true">★</span>').join('');$('shape-stamps').setAttribute('aria-label',`已完成 ${shapeStamps} 个机器人`);updateAdditionSumDisplay();updateSubtractionSumDisplay();refreshShape();}
function checkShapeWin(){const v=currentGameMode==='addition'?currentSumInMachineAddition:currentSumSubtraction;if(v===targetSum&&!shapeSolved){shapeSolved=true;shapeStamps++;$('shape-next').focus();}updateShapeUI();if(shapeSolved)$('shape-next').focus();}
function resetGameArea(){shapeVersion++;shapeHistory=[];shapeSolved=false;draggableShapes=[];shapesInMachineSubtraction=[];currentSumInMachineAddition=0;currentSumSubtraction=0;initialSumSubtraction=0;sortingMachine.innerHTML='';shapesArea.innerHTML='';sortingMachine.classList.remove('accepting','rejecting');}
function switchMode(mode){if(!['addition','subtraction'].includes(mode)||mode===currentGameMode)return;currentGameMode=mode;newShapeProblem();}
function newShapeProblem(){resetGameArea();$('addition-mode-btn').classList.toggle('active',currentGameMode==='addition');$('subtraction-mode-btn').classList.toggle('active',currentGameMode==='subtraction');$('addition-mode-btn').setAttribute('aria-pressed',String(currentGameMode==='addition'));$('subtraction-mode-btn').setAttribute('aria-pressed',String(currentGameMode==='subtraction'));$('subtraction-details').style.display=currentGameMode==='addition'?'none':'block';shapesArea.style.display=currentGameMode==='addition'?'flex':'none';$('target-label').textContent=currentGameMode==='addition'?'目标总和':'目标数值';if(currentGameMode==='addition')initAdditionMode();else initSubtractionMode();}
function initAdditionMode(){sortingMachine.innerHTML='<div class="machine-content"><span>点击积木或拖到这里</span><br><span id="current-sum-display-addition">总和: 0</span></div>';targetSum=getRandomInt(3,10);currentSumInMachineAddition=0;generateAdditionShapes();$('target-number').textContent=targetSum;updateShapeUI();}
function generateAdditionShapes(){shapesArea.innerHTML='';draggableShapes=[];const values=[1,1,1,2,2,3,getRandomInt(1,3),getRandomInt(1,3)];for(let i=values.length-1;i>0;i--){const j=getRandomInt(0,i);[values[i],values[j]]=[values[j],values[i]];}const generation=shapeVersion;values.forEach((v,i)=>{const b=createShapeElement(shapeTypes[getRandomInt(0,2)],v,'addshape-'+i);b.classList.add('draggable');b.draggable=true;b.addEventListener('click',()=>{if(generation===shapeVersion)addShape(b);});b.addEventListener('dragstart',e=>{if(generation===shapeVersion)e.dataTransfer.setData('text/plain',b.id);});shapesArea.appendChild(b);draggableShapes.push(b);});}
function addShape(b){if(currentGameMode!=='addition'||shapeSolved||!draggableShapes.includes(b))return;const v=Number(b.dataset.value);if(currentSumInMachineAddition+v>targetSum){$('feedback-message').textContent='这块太大了，试试另一块。';refreshShape();return;}currentSumInMachineAddition+=v;b.hidden=true;b.disabled=true;draggableShapes=draggableShapes.filter(s=>s!==b);shapeHistory.push({element:b,value:v});checkShapeWin();}
function handleDropAddition(e){e.preventDefault();const b=document.getElementById(e.dataTransfer.getData('text/plain'));if(b)addShape(b);}
function initSubtractionMode(){sortingMachine.innerHTML='';shapesInMachineSubtraction=[];const count=getRandomInt(4,6);for(let i=0;i<count;i++){const v=getRandomInt(1,5),b=createShapeElement(shapeTypes[getRandomInt(0,2)],v,'subshape-'+i);b.classList.add('clickable');shapesInMachineSubtraction.push({element:b,value:v,id:b.id});sortingMachine.appendChild(b);b.addEventListener('click',handleShapeRemovalClick);}initialSumSubtraction=shapesInMachineSubtraction.reduce((sum,s)=>sum+s.value,0);currentSumSubtraction=initialSumSubtraction;const removeCount=getRandomInt(1,Math.min(3,count-1));targetSum=initialSumSubtraction-shapesInMachineSubtraction.slice(0,removeCount).reduce((sum,s)=>sum+s.value,0);$('initial-sum-display').textContent=initialSumSubtraction;$('target-number').textContent=targetSum;updateShapeUI();}
function handleShapeRemovalClick(e){if(currentGameMode!=='subtraction'||shapeSolved)return;const s=shapesInMachineSubtraction.find(s=>s.element===e.currentTarget);if(!s||s.element.classList.contains('removed'))return;if(currentSumSubtraction-s.value<targetSum){$('feedback-message').textContent='这块太大了，试试另一块。';refreshShape();return;}currentSumSubtraction-=s.value;s.element.classList.add('removed');s.element.disabled=true;shapeHistory.push(s);checkShapeWin();}
function undoShape(){if(shapeSolved||!shapeHistory.length)return;const s=shapeHistory.pop();s.element.disabled=false;if(currentGameMode==='addition'){currentSumInMachineAddition-=s.value;s.element.hidden=false;draggableShapes.push(s.element);}else{currentSumSubtraction+=s.value;s.element.classList.remove('removed');}updateShapeUI();s.element.focus();}
$('addition-mode-btn').addEventListener('click',()=>switchMode('addition'));$('subtraction-mode-btn').addEventListener('click',()=>switchMode('subtraction'));$('reset-button').addEventListener('click',newShapeProblem);$('shape-next').addEventListener('click',()=>{if(shapeSolved)newShapeProblem();});$('undo-shape').addEventListener('click',undoShape);sortingMachine.addEventListener('dragover',e=>{if(currentGameMode==='addition')e.preventDefault();});sortingMachine.addEventListener('drop',handleDropAddition);
window.onload=newShapeProblem;

</script>
<kris-reviews data-game="shape_sorter_math"></kris-reviews></body>
</html>
